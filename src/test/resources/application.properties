# Test-specific configuration
spring.profiles.active=test
spring.application.name=AIChat
spring.ai.openai.api-key=test-api-key
spring.ai.openai.chat.options.model=gpt-4o-mini
server.error.include-message=always
spring.jpa.show-sql=true
spring.security.user.name=user
spring.security.user.password=password

# Use H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT
jwt.secret=test-secret-key
jwt.accessTokenExpiration=3600000
jwt.refreshTokenExpiration=86400000

# Email Configuration (disabled for tests)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Application Configuration
app.frontend-url=http://localhost:3000

# MinIO Configuration (disabled for tests)
minio.endpoint=http://localhost:9000
minio.access-key=test
minio.secret-key=test
minio.bucket-name=test-bucket
